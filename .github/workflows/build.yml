#this is generated by AI

name: Build Game

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --windowed --name "Megatron Chess" --add-data "imgs;imgs" --add-data "sounds;sounds" chess.py

      - name: Build on macOS/Linux
        if: runner.os != 'Windows'
        run: |
          pyinstaller --windowed --name "Megatron Chess" --add-data "imgs:imgs" --add-data "sounds:sounds" chess.py

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: MegatronChess-${{ runner.os }}
          path: dist/